name: Fuzzing
on:
  push:
    branches: ['probe-fuzz-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNS_IN_DOCKER: true

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/px4/px4-dev:v1.18.0
    steps:
      - uses: actions/checkout@v6

      - name: Configure Git Safe Directory
        run: git config --system --add safe.directory '*'

      # The px4-dev image ships clang without its sanitizer runtime, which
      # fuzzing mode needs for ASan. Keep this step until the job is pinned
      # to a px4-dev image that includes libclang-rt-dev.
      - name: Install clang compiler-rt
        run: apt-get update && apt-get install -y --no-install-recommends libclang-rt-18-dev

      - uses: ./.github/actions/setup-ccache
        id: ccache
        with:
          cache-key-prefix: ccache-sitl
          max-size: 300M

      - name: Build and Run Fuzz Tests
        run: |
          # Only build the tests
          export CC=clang
          export CXX=clang++
          make tests TESTFILTER=__no_tests__

          # Run the fuzz tests
          for fuzz_binary in build/px4_sitl_test/*fuzz*; do
            ./Tools/ci/run_fuzz_tests.sh $fuzz_binary 15m
          done

      - uses: ./.github/actions/save-ccache
        if: always()
        with:
          cache-primary-key: ${{ steps.ccache.outputs.cache-primary-key }}
