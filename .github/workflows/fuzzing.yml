name: Fuzzing
on:
  push:
    branches: ['probe-fuzz-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNS_IN_DOCKER: true

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/px4/px4-dev:v1.17.0-rc2
    steps:
      - uses: actions/checkout@v6

      - name: Configure Git Safe Directory
        run: git config --system --add safe.directory '*'

      - name: Install clang
        run: apt-get update && apt-get install -y clang

      - name: Toolchain diag
        run: |
          head -2 /etc/os-release; clang --version | head -1; gcc --version | head -1; cmake --version | head -1
          ls /usr/lib/gcc/x86_64-linux-gnu/; ls -d /usr/lib/llvm-*/lib/clang/*/lib/* 2>/dev/null || echo "no clang runtime dirs"
          apt-cache policy libclang-rt-18-dev libclang-rt-dev 2>/dev/null | grep -E "^[a-z]|Installed|Candidate"
          printf '#include <pthread.h>\nint main(){pthread_t t; (void)t; return 0;}\n' > /tmp/t.c
          printf '#include <string>\nint main(){std::string s="x"; return (int)s.size()-1;}\n' > /tmp/t.cpp
          clang /tmp/t.c -o /tmp/t -pthread && echo C_PTHREAD_OK || echo C_PTHREAD_FAIL
          clang++ -std=c++17 /tmp/t.cpp -o /tmp/tpp && echo CXX17_OK || echo CXX17_FAIL
          clang -fsanitize=address /tmp/t.c -o /tmp/ta -pthread && echo ASAN_OK || echo ASAN_FAIL
          clang++ -fsanitize=address,fuzzer-no-link -std=c++17 /tmp/t.cpp -o /tmp/tf && echo FUZZER_NOLINK_OK || echo FUZZER_NOLINK_FAIL
          grep -rn -E "fsanitize|FUZZTEST_FUZZING_MODE|fuzztest_setup" /__w/PX4-Autopilot/PX4-Autopilot/test/CMakeLists.txt /__w/PX4-Autopilot/PX4-Autopilot/cmake/*.cmake /__w/PX4-Autopilot/PX4-Autopilot/CMakeLists.txt 2>/dev/null | head -12

      - uses: ./.github/actions/setup-ccache
        id: ccache
        with:
          cache-key-prefix: ccache-sitl
          max-size: 300M

      - name: Build and Run Fuzz Tests
        run: |
          # Only build the tests
          export CC=clang
          export CXX=clang++
          make tests TESTFILTER=__no_tests__

          # Run the fuzz tests
          for fuzz_binary in build/px4_sitl_test/*fuzz*; do
            ./Tools/ci/run_fuzz_tests.sh $fuzz_binary 15m
          done

      - uses: ./.github/actions/save-ccache
        if: always()
        with:
          cache-primary-key: ${{ steps.ccache.outputs.cache-primary-key }}
